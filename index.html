<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HabitBase is a habit tracker built around momentum, reminders, stats, and premium features that support consistency."
    />
    <title>HabitBase</title>
    <script>
      ;(function () {
        const redirect = window.location.search
        if (!redirect.startsWith('?/')) {
          return
        }

        const path = redirect
          .slice(2)
          .replace(/~and~/g, '&')
          .replace(/&/g, '?')

        window.history.replaceState(
          null,
          '',
          window.location.pathname + path + window.location.hash,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
